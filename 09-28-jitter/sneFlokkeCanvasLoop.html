<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faldende sne</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071a21;
            background: linear-gradient(35deg, rgba(7, 26, 33, 1) 0%, rgba(50, 54, 168, 1) 33%, rgba(13, 13, 13, 1) 100%);
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <!-- Canvas elementer: vektoranimationer i html, css og JavaScript -->
    <canvas id="snowCanvas"></canvas>

    <script>
        // canvas sættes op
        const canvas = document.querySelector("#snowCanvas");
        const ctx = canvas.getContext("2d");

        // tomme variabler defineres
        let width;
        let height;
        let snowflakes = [];

        // variation: prøv en Math random
        const numberOfSnowflakes = 150;

        // styling af canvas elementet så det fylder 100% af w og h ift device
        function resizeCanvas() {
            const pixelRatio = window.devicePixelRatio || 1;

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * pixelRatio;
            canvas.height = height * pixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        }

        function createSnowflake(startAboveScreen = false) {
            // Størrelsen bestemmer også hastigheden:
            // små snefnug = længere væk og langsommere
            // store snefnug = tættere på og hurtigere
            const radius = Math.random() * 7 + 1;
            const depth = radius / 5;

            return {
                x: Math.random() * width,
                y: startAboveScreen
                    ? -Math.random() * height
                    : Math.random() * height,

                radius,
                speed: 0.5 + depth * 2.5 + Math.random() * 0.1,
                drift: (Math.random() - 0.5) * 0.5,
                opacity: 0.3 + depth * 0.7,

                // Bruges til en rolig, bølgende bevægelse
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.01 + Math.random() * 0.02
            };
        }

        function initializeSnow() {
            snowflakes = [];

            for (let i = 0; i < numberOfSnowflakes; i++) {
                snowflakes.push(createSnowflake());
            }
        }

        function updateSnowflake(snowflake) {
            snowflake.y += snowflake.speed;
            snowflake.wobble += snowflake.wobbleSpeed;

            snowflake.x +=
                snowflake.drift +
                Math.sin(snowflake.wobble) * 0.3;

            // Når snefnugget rammer bunden, flyttes det op igen
            if (snowflake.y - snowflake.radius > height) {
                snowflake.y = -snowflake.radius;
                snowflake.x = Math.random() * width;
            }

            // Sørg for at det også bliver genbrugt, hvis det blæser ud til siden
            if (snowflake.x < -20) {
                snowflake.x = width + 20;
            }

            if (snowflake.x > width + 20) {
                snowflake.x = -20;
            }
        }

        // ctx.path: tegner stier
        function drawSnowflake(snowflake) {
            ctx.beginPath();
            ctx.arc(
                snowflake.x,
                snowflake.y,
                snowflake.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = `rgba(255, 255, 255, ${snowflake.opacity})`;
            ctx.fill();
        }

        // clearrect: sletter framen så en ny kan tegnes
        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (const snowflake of snowflakes) {
                updateSnowflake(snowflake);
                drawSnowflake(snowflake);
            }

            requestAnimationFrame(animate);
        }

        // vinduets størrelse tilpasses ved en "resize"
        window.addEventListener("resize", () => {
            resizeCanvas();
            initializeSnow();
        });

        // hele animationen fyres af
        resizeCanvas(); // tilpasser størrelsen af canvas
        initializeSnow(); // laver en masse snefnug
        animate(); // sætter i gang
    </script>
</body>

</html>
